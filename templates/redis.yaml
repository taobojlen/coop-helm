{{- if .Values.redis.enabled }}
{{ include "coop.storage" (dict "root" . "service" "redis") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "coop.name" . }}-redis
  labels:
    {{- include "coop.labels" . | nindent 4 }}
spec:
  ports: [{ name: redis, port: {{ .Values.redis.port }}, targetPort: 6379 }]
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "coop.name" . }}-redis
  labels:
    {{- include "coop.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "coop.name" . }}-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: redis
    spec:
      {{- include "coop.podSecurity" . | nindent 6 }}
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          command: [redis-server]
          args: [--appendonly, 'yes', --maxmemory, {{ .Values.redis.maxmemory | quote }}, --maxmemory-policy, noeviction, --requirepass, '$(REDISCLI_AUTH)']
          securityContext:
            {{- include "coop.containerSecurity" . | nindent 12 }}
          env:
            - name: REDISCLI_AUTH
              {{- include "coop.secret" (dict "root" . "key" "redis") | nindent 14 }}
          ports: [{ name: redis, containerPort: 6379 }]
          startupProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec: { command: [redis-cli, ping] }
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "coop.name" . }}-redis
{{- end }}
