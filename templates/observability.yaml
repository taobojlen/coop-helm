{{- if and .Values.observability.enabled (not .Values.bootstrapOnly) }}
{{- $image := required "observability.instrumentationImage is required" .Values.observability.instrumentationImage }}
{{- if or (not (regexMatch "(@sha256:[a-fA-F0-9]{64}|:[^/:@]+)$" $image)) (regexMatch ":(latest|edge)$" $image) }}
{{- fail "observability.instrumentationImage must specify a pinned image" }}
{{- end }}
{{- range .Values.extraEnv }}
{{- if or (hasPrefix "OTEL_" .name) (hasPrefix "COOP_OTEL_" .name) (eq .name "NODE_OPTIONS") (eq .name "HONEYCOMB_API_KEY") }}
{{- fail "observability.enabled manages NODE_OPTIONS, HONEYCOMB_API_KEY, OTEL_* and COOP_OTEL_*; remove these from extraEnv" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "coop.name" . }}-otel
  labels:
    {{- include "coop.labels" . | nindent 4 }}
data:
  bootstrap.cjs: |
    {{- .Files.Get "files/otel-bootstrap.cjs" | nindent 4 }}
{{- end }}
