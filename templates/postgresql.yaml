{{- if .Values.postgresql.enabled }}
{{ include "coop.storage" (dict "root" . "service" "postgresql") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "coop.name" . }}-postgresql
  labels:
    {{- include "coop.labels" . | nindent 4 }}
spec:
  ports: [{ name: postgres, port: {{ .Values.postgresql.port }}, targetPort: 5432 }]
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "coop.name" . }}-postgresql
  labels:
    {{- include "coop.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "coop.name" . }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: postgresql
    spec:
      {{- include "coop.podSecurity" . | nindent 6 }}
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - { name: POSTGRES_USER, value: {{ .Values.postgresql.username | quote }} }
            - { name: POSTGRES_DB, value: {{ .Values.postgresql.database | quote }} }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              {{- include "coop.secret" (dict "root" . "key" "postgresql") | nindent 14 }}
          ports: [{ name: postgres, containerPort: 5432 }]
          startupProbe:
            exec:
              command: [pg_isready, -U, {{ .Values.postgresql.username | quote }}, -d, {{ .Values.postgresql.database | quote }}]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [pg_isready, -U, {{ .Values.postgresql.username | quote }}, -d, {{ .Values.postgresql.database | quote }}]
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "coop.name" . }}-postgresql
{{- end }}
